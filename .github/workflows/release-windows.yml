name: Build Windows

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['windows/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Veil for Windows
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          ./windows/scripts/build_windows.ps1 -Version $v

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: Veil-windows
          path: windows/dist/*.zip

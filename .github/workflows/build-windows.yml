name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Veil for Windows
        shell: pwsh
        run: ./windows/scripts/build_windows.ps1 -Version 1.0.0

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: Veil-windows
          path: windows/dist/*.zip

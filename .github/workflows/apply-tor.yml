name: Apply Tor files
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show files in repo
        run: ls -la
      - name: Unpack and commit
        run: |
          z=$(ls *.zip | head -1)
          echo "Using: $z"
          unzip -o "$z"
          rm -f "$z"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add Tor window"
          git push

name: Apply Tor files
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move files up one level
        run: |
          ls windows
          if [ -d windows/windows-1 ]; then
            cp -a windows/windows-1/. windows/
            rm -rf windows/windows-1
          fi
          ls windows
          ls windows/Veil.Windows/App/Tor
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Move Tor files into place"
          git push

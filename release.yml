name: Build installer

on:
  push:
    tags: ['v*']          # e.g. git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:      # or run it by hand from the Actions tab

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Veil.dmg and Veil.zip
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev"; fi
          ./scripts/make_dmg.sh "$VERSION"

      - name: Keep the files as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veil
          path: dist/*

      - name: Publish a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
